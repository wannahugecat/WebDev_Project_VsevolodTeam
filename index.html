<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John O’Reilly’s cars</title>
    <style>

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 2px solid grey; /* line under header */
        }

        /* container with buttons */
        .topButtons {
            display: flex;
            gap: 20px; /* space between buttons */
        }

        .topButtons h2 {
            margin: 0;
            cursor: pointer;
        }
        .disabilitiesButton {
            display: flex;
            align-items: center;
            margin-left: auto;
        }
        a {
            position: fixed;
            bottom: 10px;
            left: 10px;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>John O’Reilly’s Cars</h1>
        <div class="topButtons">
            <h2>Cars</h2>
            <h2>Collection</h2>
            <h2>John's opinion</h2>
            <div class="disabilitiesButton">
                <img src="disabilitiesButton.png" alt="Button for people with disabilities">
            </div>
        </div>
    </header>

    <a>© 2026 John O’Reilly. All cars subject to enthusiastic inspection.</a>

</body>
</html>
